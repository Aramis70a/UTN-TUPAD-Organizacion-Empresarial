<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#222"/>
    </marker>
    <marker id="ahm" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1a5aa8"/>
    </marker>
  </defs>
  <rect width="1100" height="660" fill="#ffffff"/>
  <text x="550" y="18" text-anchor="middle" font-size="15" font-weight="bold" fill="#005060">Figura 1 — Proceso de gestión de proyectos y facturación (BPMN)</text>

  <!-- Pool Cliente -->
  <rect x="20" y="30" width="1060" height="92" fill="#f7f9fb" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="30" width="100" height="92" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#005060">CLIENTE</text>
  <text x="70" y="86" text-anchor="middle" font-size="9" fill="#555">(actor externo)</text>

  <circle cx="160" cy="76" r="15" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="160" y="80" text-anchor="middle" font-size="9">inicio</text>
  <rect x="210" y="54" width="170" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="295" y="72" text-anchor="middle" font-size="10">Solicitar</text>
  <text x="295" y="86" text-anchor="middle" font-size="10">propuesta</text>
  <rect x="830" y="54" width="180" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="920" y="72" text-anchor="middle" font-size="10">Recibir entrega</text>
  <text x="920" y="86" text-anchor="middle" font-size="10">y pagar</text>

  <!-- Pool NubiaSoft -->
  <rect x="20" y="130" width="1060" height="500" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="20" y="130" width="100" height="500" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#005060" transform="rotate(-90 70 365)">NUBIASOFT S.A.</text>

  <!-- Lanes -->
  <rect x="120" y="130" width="960" height="125" fill="#fbfcfd" stroke="#999"/>
  <rect x="120" y="255" width="960" height="125" fill="#ffffff" stroke="#999"/>
  <rect x="120" y="380" width="960" height="125" fill="#fbfcfd" stroke="#999"/>
  <rect x="120" y="505" width="960" height="125" fill="#ffffff" stroke="#999"/>
  <text x="70" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Comercial</text>
  <text x="70" y="317" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Desarrollo</text>
  <text x="70" y="442" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Calidad</text>
  <text x="70" y="567" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">Sistema/Admin</text>

  <!-- Comercial: A, B, G1, C -->
  <rect x="140" y="170" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="220" y="188" text-anchor="middle" font-size="10">Relevar</text>
  <text x="220" y="202" text-anchor="middle" font-size="10">requerimientos</text>

  <rect x="340" y="170" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="420" y="188" text-anchor="middle" font-size="10">Elaborar</text>
  <text x="420" y="202" text-anchor="middle" font-size="10">presupuesto</text>

  <line x1="610" y1="160" x2="650" y2="192" stroke="#222"/>
  <line x1="650" y1="192" x2="610" y2="224" stroke="#222"/>
  <line x1="610" y1="224" x2="570" y2="192" stroke="#222"/>
  <line x1="570" y1="192" x2="610" y2="160" stroke="#222"/>
  <text x="610" y="188" text-anchor="middle" font-size="10">¿Cliente</text>
  <text x="610" y="200" text-anchor="middle" font-size="10">aprueba?</text>

  <rect x="720" y="170" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="800" y="188" text-anchor="middle" font-size="10">Crear</text>
  <text x="800" y="202" text-anchor="middle" font-size="10">proyecto</text>

  <!-- Desarrollo: D, E -->
  <rect x="720" y="295" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="800" y="313" text-anchor="middle" font-size="10">Planificar</text>
  <text x="800" y="327" text-anchor="middle" font-size="10">proyecto</text>
  <rect x="480" y="295" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="560" y="313" text-anchor="middle" font-size="10">Desarrollar</text>
  <text x="560" y="327" text-anchor="middle" font-size="10">módulo</text>

  <!-- Calidad: F, G2 -->
  <rect x="480" y="420" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="560" y="438" text-anchor="middle" font-size="10">Ejecutar</text>
  <text x="560" y="452" text-anchor="middle" font-size="10">pruebas</text>
  <line x1="800" y1="410" x2="840" y2="442" stroke="#222"/>
  <line x1="840" y1="442" x2="800" y2="474" stroke="#222"/>
  <line x1="800" y1="474" x2="760" y2="442" stroke="#222"/>
  <line x1="760" y1="442" x2="800" y2="410" stroke="#222"/>
  <text x="800" y="438" text-anchor="middle" font-size="10">¿QA</text>
  <text x="800" y="450" text-anchor="middle" font-size="10">aprueba?</text>

  <!-- Sistema: H, I, End -->
  <rect x="720" y="545" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="800" y="563" text-anchor="middle" font-size="10">Generar</text>
  <text x="800" y="577" text-anchor="middle" font-size="10">factura</text>
  <rect x="480" y="545" width="160" height="44" rx="6" fill="#fff" stroke="#222"/>
  <text x="560" y="563" text-anchor="middle" font-size="10">Registrar</text>
  <text x="560" y="577" text-anchor="middle" font-size="10">cobro</text>
  <circle cx="340" cy="567" r="16" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="340" y="571" text-anchor="middle" font-size="9">fin</text>

  <!-- Flujos (secuencia) -->
  <line x1="175" y1="76" x2="208" y2="76" stroke="#222" marker-end="url(#ah)"/>
  <line x1="300" y1="192" x2="338" y2="192" stroke="#222" marker-end="url(#ah)"/>
  <line x1="500" y1="192" x2="568" y2="192" stroke="#222" marker-end="url(#ah)"/>
  <line x1="650" y1="192" x2="718" y2="192" stroke="#222" marker-end="url(#ah)"/>
  <text x="684" y="184" font-size="9" fill="#1a7a3a">Sí</text>
  <line x1="800" y1="214" x2="800" y2="293" stroke="#222" marker-end="url(#ah)"/>
  <line x1="718" y1="317" x2="642" y2="317" stroke="#222" marker-end="url(#ah)"/>
  <line x1="560" y1="339" x2="560" y2="418" stroke="#222" marker-end="url(#ah)"/>
  <line x1="642" y1="442" x2="758" y2="442" stroke="#222" marker-end="url(#ah)"/>
  <line x1="800" y1="474" x2="800" y2="543" stroke="#222" marker-end="url(#ah)"/>
  <text x="808" y="510" font-size="9" fill="#1a7a3a">Sí</text>
  <line x1="718" y1="567" x2="642" y2="567" stroke="#222" marker-end="url(#ah)"/>
  <line x1="478" y1="567" x2="358" y2="567" stroke="#222" marker-end="url(#ah)"/>

  <!-- Excepción 1: cliente no aprueba -->
  <polyline points="610,160 610,145 420,145 420,168" fill="none" stroke="#b03030" marker-end="url(#ah)"/>
  <text x="515" y="141" text-anchor="middle" font-size="9" fill="#b03030">No: ajustar propuesta</text>

  <!-- Excepción 2: QA no aprueba -->
  <polyline points="800,410 800,395 560,395 560,341" fill="none" stroke="#b03030" marker-end="url(#ah)"/>
  <text x="680" y="391" text-anchor="middle" font-size="9" fill="#b03030">No: corregir defectos</text>

  <!-- Mensajes entre pools -->
  <line x1="380" y1="76" x2="215" y2="168" stroke="#1a5aa8" stroke-dasharray="6,4" marker-end="url(#ahm)"/>
  <polyline points="880,567 1050,567 1050,76 1012,76" fill="none" stroke="#1a5aa8" stroke-dasharray="6,4" marker-end="url(#ahm)"/>
</svg>
